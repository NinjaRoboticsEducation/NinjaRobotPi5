[project]
name = "ninjarobot-pi5-v4"
version = "0.0.0"
description = "Modular robot middleware and AI agent for Raspberry Pi 5."
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff==0.15.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
markers = [
    "hardware: requires physical Raspberry Pi hardware and explicit operator approval",
    "integration: exercises more than one V4 component",
    "provider_live: calls a real model provider and is excluded from default validation",
]
