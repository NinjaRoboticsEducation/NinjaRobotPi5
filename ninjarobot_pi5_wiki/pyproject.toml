[project]
name = "local-llm-wiki"
version = "0.2.1"
description = "A local-first, agent-maintained, OKF v0.2 knowledge base template"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.23,<5",
  "pillow>=11.0,<13",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0,<7"]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["llmwiki"]
branch = true

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.11.0"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6.0,<8"]
