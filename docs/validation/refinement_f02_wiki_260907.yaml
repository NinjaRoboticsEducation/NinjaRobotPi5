    \ F01/F03/F04 and later refinements remain unfinished.\n    AI review, not human\
    \ verification or physical Pi validation.\n---\n\n# Knowledge limitations and\
    \ verification\n\nKeyword search covers curated pages rather than all raw manual\
    \ text. It does not\nfollow citations for the caller. Try focused terms, read\
    \ the overview, and open\nfull sources. Search expiry flags, source fingerprints,\
    \ and semantic review\nstatus are separate signals and must be checked together.[^src-20260907-knowledgeintegration]\n\
    \nA missing result is an evidence gap, not proof a feature is absent. A page can\
    \ be\nstructurally valid while its explanation needs review. Current implementation\n\
    fingerprints identify files needing knowledge review but cannot prove that prose\n\
    is correct. AI-reviewed pages are not human-verified or hardware-tested pages.\n\
    Editor adapters need actual session activation checks; a wiki-only workspace may\n\
    not expose parent robot code.[^src-20260907-knowledgeintegration]\n\nThe development\
    \ guide's older quality-gate example uses narrower lint paths than\nthe current\
    \ root policy. Follow the root operating policy for the current full\nchecks,\
    \ and preserve the source's historical context rather than silently treating\n\
    an older example as the complete current gate.[^src-20260907-developmentguide-2][^src-20260907-knowledgeintegration]\n\
