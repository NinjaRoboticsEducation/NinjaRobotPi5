    \n[Open installation reference](/references/installation-guide.md).\n\n\n## Busy-robot\
    \ stop feedback\n\nF02 adds an independent stop-dispatch path. A stop timeout\
    \ or cleanup error must\nnot be interpreted as proof that hardware stopped. The\
