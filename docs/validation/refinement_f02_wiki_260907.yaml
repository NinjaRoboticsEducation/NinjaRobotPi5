    \ or failure case before changing it.[^src-20260907-developmentguide-2]\n\nMCP\
    \ (Model Context Protocol) lets an application discover and call external tools.\n\
    The robot tutorial describes allowlisted read-only tools, bounded results,\ntimeouts,\
    \ and untrusted external content. Its examples include Tavily search\nand a read-only\
    \ Google Calendar server. Agent Skills package reusable workflows;\nthey do not\
    \ grant extra hardware permissions.[^src-20260906-ninjarobot-mcp-skill]\n\nDevelopment\
    \ wiki skills are a separate coding-tool workflow. This local knowledge\nintegration\
    \ does not install a robot MCP provider or change runtime interfaces.\nUse the\
    \ existing robot tutorial for robot extensions and the wiki maintenance\nguide\
    \ for developer knowledge updates.[^src-20260907-knowledgeintegration]\n\n[MCP\
    \ and skills tutorial](/references/mcp-skills-guide.md).\n\n\n## F02 stop behavior\n\
    \nEmergency Stop in the browser revokes motion permissions before dispatch and\
    \ does\nnot wait behind an earlier movement command. A conflicting new action\
    \ can return\n`ACTION_STOP_IN_PROGRESS`. Stop names, arguments and stored result\
