  content: "---\ntype: Concept\ntitle: Architecture and hardware ownership\ndescription:\
    \ Agent, IDE, device drivers, safety policy, resource ownership, and code\n  boundaries.\n\
    status: draft\ntags:\n- architecture\n- hardware\n- ownership\n- agent\n- ide\n\
    - drivers\n- safety\ngenerated:\n  by: agent:codex\n  at: '2026-09-06T22:53:22Z'\n\
    sources:\n- id: src-20260907-developmentguide-2\n  resource: urn:llmwiki:source:src-20260907-developmentguide-2\n\
    \  title: DevelopmentGuide.md\n  content_hash: sha256:c68338c5f0772a14528b2c8f50bdbfc843f9338bd7816e50e49710fa57bd0e19\n\
    semantic_review:\n  version: 1\n  performed_by: agent:codex\n  performed_at: '2026-09-07T09:34:22Z'\n\
    \  target_hash: sha256:7bcbbf30901b57540bc6cefb2bdbf9247dbc189426a7ff2995f616fddc57035b\n\
    \  result: passed\n  checks:\n    source_support: passed\n    contradictions:\
    \ passed\n    limitations: passed\n    claim_strength: passed\n    visual_evidence:\
    \ not_applicable\n  notes:\n  - Compared this page with the unchanged source material\
    \ carried into the new manual\n    version; reviewed added F02 statements against\
    \ its new sections and simulated\n    validation.\n  - F02 queue dispatch only;\
    \ F01/F03/F04 and later refinements remain unfinished.\n    AI review, not human\
    \ verification or physical Pi validation.\n---\n\n# Architecture and hardware\
    \ ownership\n\nThe documented hardware path is user or model → ninjarobot_pi5_agent\
    \ →\nninjarobot_pi5_ide → a managed pi5 driver → its device. The Agent handles\
    \ user\ninteraction, model-provider translation, policy, sessions, and tool proposals.\n\
    It should not import a pi5 library or access a device directly.[^src-20260907-developmentguide-2]\n\
    \nThe IDE (the project's device-coordination layer) owns shared resource scheduling,\n\
    action execution, safety state, behaviors, and hardware ownership. Individual\n\
    managed libraries own their device and standalone setup interface. The six\nmanaged\
    \ libraries cover servo motors, display, buzzer, distance sensing, camera,\nand\
    \ microphone.[^src-20260907-developmentguide-2]\n\nThis is the documented architecture\
    \ contract. Compare affected code and tests\nwith it before implementation; this\
    \ page does not certify that every failure or\nphysical safety condition has been\
    \ tested.[^src-20260907-developmentguide-2]\n\n[Read the development manual](/references/development-guide.md).\n\
    \n\n## Emergency stop dispatch — F02\n\nThe three trusted IDE stop commands bypass\
    \ ordinary queue capacity and resource\nlocks. They request cancellation of competing\
    \ actions without waiting for that\ncleanup; new conflicting work is rejected\
    \ while stop is executing. Partial lock\nacquisition is cleaned up on cancellation.\
    \ This establishes queue independence,\nnot a measured physical stopping time.\
    \ F01, F03 and F04 remain unfinished.[^src-20260907-developmentguide-2]\n\n\n\
    [^src-20260907-developmentguide-2]: DevelopmentGuide.md, source version `refinement-f02-260907`;\
    \ registered source `src-20260907-developmentguide-2`.\n"
