    \ F01/F03/F04 and later refinements remain unfinished.\n    AI review, not human\
    \ verification or physical Pi validation.\n---\n\n# Installation and hardware\
    \ checks\n\nUse the full installation guide for the supported Raspberry Pi setup,\n\
