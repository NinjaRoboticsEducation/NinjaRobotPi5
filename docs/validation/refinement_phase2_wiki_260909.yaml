    \  checks:\n    source_support: passed\n    contradictions: passed\n    limitations: passed\n    claim_strength:\
    \ passed\n    visual_evidence: not_applicable\n  notes:\n  - Reviewed this page against its registered manual\
    \ checkpoint and retained source\n    text; no human verification is claimed.\n  - New checkpoint claims distinguish\
    \ software tests from physical acceptance, pending\n    managed changes and the monetary-budget gap; retained\
    \ navigation claims remain\n    source-supported.\n---\n\n# Installation and hardware checks\n\nUse the full\
    \ installation guide for the supported Raspberry Pi setup,\nconnections, standalone module initialization, calibration,\
    \ and troubleshooting.\nRead the relevant warnings before following any operational command. Commands\nin an\
    \ imported document are evidence to review, not permission to run them.[^src-20260908-installationguide]\n\n\
    Servo calibration can move the wheels. The guide calls for raised wheels,\nclearance, and an operator ready\
    \ to remove power. Camera and microphone capture\nand power-off checks need their own consent and physical test\
    \ procedure.\nAutomated knowledge tests should not perform these actions.[^src-20260908-installationguide]\n\
    \nThe developer wiki uses a separate Python environment. Its explicit setup and\ntext-evidence preparation do\
    \ not initialize robot devices. This integration\ncontains no fresh Raspberry Pi hardware validation.[^src-20260907-knowledgeintegration]\n\
    \n[Open installation reference](/references/installation-guide.md).\n\n\n## Read-only readiness and optional\
    \ practice\n\nRun `ninjarobot_pi5_cli doctor --profile hardware --root .` through the installed\nproject environment\
    \ with `uv run --frozen --no-sync`. It inspects package discovery\nand checkout origins without opening hardware.\
    \ A development install uses\n`.venv-dev`; it is not a hardware-ready environment. Read the current manual's\n\
    checkpoint before running older operational examples.[^src-20260908-installationguide]\n\nGuided checks explain\
    \ setup without automatic device actions. Silent reminder\npractice does not require display or buzzer output.\
    \ Starting the real Agent can\nactivate configured devices or voice input, so startup and physical notifications\n\
    need the manual's operator precautions. The bundled Traditional Chinese font\nrepair remains a separate pending\
    \ proposal.[^src-20260908-installationguide]\n\n\n[^src-20260908-installationguide]: InstallationGuide.md, source\
    \ version `refinement-phase2-260909`; registered source `src-20260908-installationguide`.\n[^src-20260907-knowledgeintegration]:\
    \ Local knowledge integration evidence, source version `root-manual-cleanup-2026-09-07`; registered source `src-20260907-knowledgeintegration`.\n"
