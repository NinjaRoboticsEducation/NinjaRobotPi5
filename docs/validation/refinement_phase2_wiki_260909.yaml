  content: "---\ntype: Concept\ntitle: Architecture and hardware ownership\ndescription: Agent, IDE, device drivers,\
    \ safety policy, resource ownership, and code\n  boundaries.\nstatus: draft\ntags:\n- architecture\n- hardware\n\
    - ownership\n- agent\n- ide\n- drivers\n- safety\ngenerated:\n  by: agent:codex\n  at: '2026-09-06T22:53:22Z'\n\
    sources:\n- id: src-20260908-developmentguide\n  resource: urn:llmwiki:source:src-20260908-developmentguide\n\
    \  title: DevelopmentGuide.md\n  content_hash: sha256:640cb37251c7d9c7d41a23a4998aa0b25dcbfa8bba952435adeda61f821fd6e6\n\
    semantic_review:\n  version: 1\n  performed_by: agent:codex\n  performed_at: '2026-09-08T15:25:18.461989+00:00'\n\
    \  target_hash: sha256:0ea2a69d72f6230216447ff5e95ec0a3244215e7db3378114f37a6f781afd2b2\n  result: passed\n\
    \  checks:\n    source_support: passed\n    contradictions: passed\n    limitations: passed\n    claim_strength:\
    \ passed\n    visual_evidence: not_applicable\n  notes:\n  - Reviewed this page against its registered manual\
    \ checkpoint and retained source\n    text; no human verification is claimed.\n  - New checkpoint claims distinguish\
    \ software tests from physical acceptance, pending\n    managed changes and the monetary-budget gap; retained\
    \ navigation claims remain\n    source-supported.\n---\n\n# Architecture and hardware ownership\n\nThe documented\
    \ hardware path is user or model → ninjarobot_pi5_agent →\nninjarobot_pi5_ide → a managed pi5 driver → its device.\
    \ The Agent handles user\ninteraction, model-provider translation, policy, sessions, and tool proposals.\nIt\
    \ should not import a pi5 library or access a device directly.[^src-20260908-developmentguide]\n\nThe IDE (the\
    \ project's device-coordination layer) owns shared resource scheduling,\naction execution, safety state, behaviors,\
    \ and hardware ownership. Individual\nmanaged libraries own their device and standalone setup interface. The\
    \ six\nmanaged libraries cover servo motors, display, buzzer, distance sensing, camera,\nand microphone.[^src-20260908-developmentguide]\n\
    \nThis is the documented architecture contract. Compare affected code and tests\nwith it before implementation;\
    \ this page does not certify that every failure or\nphysical safety condition has been tested.[^src-20260908-developmentguide]\n\
    \n[Read the development manual](/references/development-guide.md).\n\n\n## Local task and safety integration\n\
    \nThe Agent owns reminder scheduling and scoped request records in its existing\nprivate database. Deterministic\
    \ controls confirm exact notification effects;\nphysical delivery uses the existing IDE expression capability.\
    \ Models cannot\nconfirm reminders or open drivers. Interrupted work is uncertain rather than\nsilently replayed.[^src-20260908-developmentguide]\n\
    \nTrusted stop dispatch is independent of the ordinary queue. Retained real-device\nbuilders share IDE ownership,\
    \ disabled devices skip initialization/recovery, and\nintegrated raw movement uses the existing safety controller\
    \ and bounded cleanup.\nA blocked native driver call cannot be forcibly ended by Python cancellation;\nphysical\
    \ stopping time remains a manual validation question.[^src-20260908-developmentguide]\n\n\n[^src-20260908-developmentguide]:\
    \ DevelopmentGuide.md, source version `refinement-phase2-260909`; registered source `src-20260908-developmentguide`.\n"
