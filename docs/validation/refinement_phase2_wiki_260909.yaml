    - id: src-20260907-knowledgeintegration\n  resource: urn:llmwiki:source:src-20260907-knowledgeintegration\n\
    \  title: Local knowledge integration evidence\n  content_hash: sha256:776049c49cbf2bf69cd0d59db1cbdfaaaea88ffa962f05548a604fec80071622\n\
    semantic_review:\n  version: 1\n  performed_by: agent:codex\n  performed_at: '2026-09-08T15:25:18.461989+00:00'\n\
    \  target_hash: sha256:79e9260a1e363c78e47af7130924231b68d4b1e6532fbce01b288f362d33897f\n  result: passed\n\
    \  checks:\n    source_support: passed\n    contradictions: passed\n    limitations: passed\n    claim_strength:\
    \ passed\n    visual_evidence: not_applicable\n  notes:\n  - Reviewed this page against its registered manual\
    \ checkpoint and retained source\n    text; no human verification is claimed.\n  - New checkpoint claims distinguish\
    \ software tests from physical acceptance, pending\n    managed changes and the monetary-budget gap; retained\
    \ navigation claims remain\n    source-supported.\n---\n\n# Features, MCP tools, and Agent Skills\n\nThe development\
    \ guide describes conversational and web interfaces, model\nproviders, behaviors, memory, and device capabilities.\
    \ These are documented\nimplementation areas; use the current code and tests to verify a specific\nfeature or\
    \ failure case before changing it.[^src-20260908-developmentguide]\n\nMCP (Model Context Protocol) lets an application\
    \ discover and call external tools.\nThe robot tutorial describes allowlisted read-only tools, bounded results,\n\
    timeouts, and untrusted external content. Its examples include Tavily search\nand a read-only Google Calendar\
    \ server. Agent Skills package reusable workflows;\nthey do not grant extra hardware permissions.[^src-20260908-ninjarobot-mcp-skill]\n\
    \nDevelopment wiki skills are a separate coding-tool workflow. This local knowledge\nintegration does not install\
    \ a robot MCP provider or change runtime interfaces.\nUse the existing robot tutorial for robot extensions and\
    \ the wiki maintenance\nguide for developer knowledge updates.[^src-20260907-knowledgeintegration]\n\n[MCP and\
    \ skills tutorial](/references/mcp-skills-guide.md).\n\n\n## Local reminders, task progress and memory\n\nIn\
    \ existing chat, `/remind 120 Practice` creates a silent draft. `/tasks confirm ID`\nexplicitly schedules the\
    \ reviewed time and effect. `/tasks`, cancel and snooze\ncontrols also appear in the browser Local tasks panel.\
    \ Snooze needs fresh review.\nExact dated reminders support daily/weekly repeat and optional reviewed display\n\
    text plus a buzzer tone. They do not request wheel movement.[^src-20260908-developmentguide]\n\nThe Pi and Agent\
    \ must stay running. Once saved, reminders need no cloud model.\nLate reminders become missed; interrupted delivery\
    \ becomes uncertain without\nautomatic replay. A silent reminder's completion means its local inbox result was\n\
    saved, not that the user read it. Request completion means response processing\nended; tool evidence determines\
    \ what is known about external effects.[^src-20260908-developmentguide]\n\nTask progress requires refresh. General\
    \ requests do not autonomously resume after\nrestart. Model calls, actual tool attempts including retries, input\
    \ size, requested\noutput and time are bounded; this is not a currency-denominated spending cap.\n`/memory review`,\
    \ confirm, edit and forget expose source/confidence and correction.\nConfirmed structured preferences resist\
    \ contradictory inference; arbitrary\nnatural-language contradiction resolution is not comprehensive.[^src-20260908-developmentguide]\n\
    \nCustom MCP servers require local read-only and retry-safe allowlists. Discovery,\nschemas and results are\
    \ bounded and checked; external output remains untrusted.\nThe local task tools can list or preview, but have\
    \ no model confirmation tool.\nCalendar writes and later refinement phases are outside this checkpoint.[^src-20260908-ninjarobot-mcp-skill]\n\
    \n\n[^src-20260908-ninjarobot-mcp-skill]: NinjaRobot_MCP_Skill.md, source version `refinement-phase2-260909`;\
    \ registered source `src-20260908-ninjarobot-mcp-skill`.\n[^src-20260908-developmentguide]: DevelopmentGuide.md,\
    \ source version `refinement-phase2-260909`; registered source `src-20260908-developmentguide`.\n[^src-20260907-knowledgeintegration]:\
    \ Local knowledge integration evidence, source version `root-manual-cleanup-2026-09-07`; registered source `src-20260907-knowledgeintegration`.\n"
