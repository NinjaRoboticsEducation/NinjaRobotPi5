    \ software tests from physical acceptance, pending\n    managed changes and the monetary-budget gap; retained\
    \ navigation claims remain\n    source-supported.\n---\n\n# Knowledge limitations and verification\n\nKeyword\
    \ search covers curated pages rather than all raw manual text. It does not\nfollow citations for the caller.\
    \ Try focused terms, read the overview, and open\nfull sources. Search expiry flags, source fingerprints, and\
    \ semantic review\nstatus are separate signals and must be checked together.[^src-20260907-knowledgeintegration]\n\
    \nA missing result is an evidence gap, not proof a feature is absent. A page can be\nstructurally valid while\
    \ its explanation needs review. Current implementation\nfingerprints identify files needing knowledge review\
    \ but cannot prove that prose\nis correct. AI-reviewed pages are not human-verified or hardware-tested pages.\n\
    Editor adapters need actual session activation checks; a wiki-only workspace may\nnot expose parent robot code.[^src-20260907-knowledgeintegration]\n\
    \nThe development guide's older quality-gate example uses narrower lint paths than\nthe current root policy.\
    \ Follow the root operating policy for the current full\nchecks, and preserve the source's historical context\
    \ rather than silently treating\nan older example as the complete current gate.[^src-20260908-developmentguide][^src-20260907-knowledgeintegration]\n\
    \n[Project overview](/overview.md).\n\n\n## Limits of the refinement checkpoint\n\nThe new manual checkpoint\
    \ supersedes pre-refinement behavior descriptions.\nCurrent software validation is not physical acceptance.\
    \ Reminders require a\nrunning service; general requests do not automatically resume; unknown external\neffects\
    \ are not replayed. Memory conflict protection is limited to structured\npreferences. Bounded usage does not\
    \ enforce a currency-denominated spending cap.\nFace cleanup and the Traditional Chinese display font remain\
    \ pending managed\nchanges. Do not turn these qualifications into a claim that all refinements are\nfinished.[^src-20260908-developmentguide]\n\
    \n\n[^src-20260907-knowledgeintegration]: Local knowledge integration evidence, source version `root-manual-cleanup-2026-09-07`;\
    \ registered source `src-20260907-knowledgeintegration`.\n[^src-20260908-developmentguide]: DevelopmentGuide.md,\
    \ source version `refinement-phase2-260909`; registered source `src-20260908-developmentguide`.\n"
