- op: write
  path: wiki/concepts/architecture.md
  content: "---\ntype: Concept\ntitle: Architecture and hardware ownership\ndescription:\
    \ Agent, IDE, device drivers, safety policy, resource ownership, and code\n  boundaries.\n\
    status: draft\ntags:\n- architecture\n- hardware\n- ownership\n- agent\n- ide\n\
    - drivers\n- safety\ngenerated:\n  by: agent:codex\n  at: '2026-09-06T22:53:22Z'\n\
    sources:\n- id: src-20260906-developmentguide\n  resource: urn:llmwiki:source:src-20260906-developmentguide\n\
    \  title: DevelopmentGuide.md\n  content_hash: sha256:80e65e182e818957c7938c055a4327b3f4c79a6807b38c7b05580248f77eb38e\n\
    ---\n\n# Architecture and hardware ownership\n\nThe documented hardware path is\
    \ user or model → ninjarobot_pi5_agent →\nninjarobot_pi5_ide → a managed pi5 driver\
    \ → its device. The Agent handles user\ninteraction, model-provider translation,\
    \ policy, sessions, and tool proposals.\nIt should not import a pi5 library or\
    \ access a device directly.[^src-20260906-developmentguide]\n\nThe IDE (the project's\
    \ device-coordination layer) owns shared resource scheduling,\naction execution,\
    \ safety state, behaviors, and hardware ownership. Individual\nmanaged libraries\
    \ own their device and standalone setup interface. The six\nmanaged libraries\
    \ cover servo motors, display, buzzer, distance sensing, camera,\nand microphone.[^src-20260906-developmentguide]\n\
    \nThis is the documented architecture contract. Compare affected code and tests\n\
    with it before implementation; this page does not certify that every failure or\n\
    physical safety condition has been tested.[^src-20260906-developmentguide]\n\n\
    [Read the development manual](/references/development-guide.md).\n\n\n[^src-20260906-developmentguide]:\
    \ DevelopmentGuide.md, source version `migration-2026-09-07`; registered source\
    \ `src-20260906-developmentguide`.\n"
