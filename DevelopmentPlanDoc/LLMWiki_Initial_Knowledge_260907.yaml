    ---\n\n# Development and documentation workflow\n\nBefore significant development,\
    \ consult the local wiki and the current full\nmanuals, inspect relevant code,\
    \ and identify missing or conflicting evidence.\nThe root project policy requires\
    \ an approved phased plan and preservation of\nrobot interfaces and managed-driver\
    \ rules.[^src-20260906-developmentguide]\n\nFeature completion includes a wiki\
    \ impact assessment. Update affected manual\nversions, topic pages, specifications\
    \ and architecture guidance, then record\nthe change and validation in the development\
    \ log. If no documentation change is\nneeded, record a specific reason. A new\
    \ source version preserves the old source;\ncurrent navigation and the knowledge\
    \ map identify the active version.[^src-20260906-knowledgeintegration]\n\nUse\
    \ the project's maintenance guide outside the knowledge bundle for exact\ncommands.\
    \ Prepare a semantic page plan, validate it, show the actual diff, and\napply\
    \ the approved plan with the wiki CLI. Review source support honestly and\ncheck\
    \ current pointers, file fingerprints, links, indexes and review coverage.\nAI\
    \ review is distinct from human verification.[^src-20260906-knowledgeintegration]\n\
    \n[Development guide](/references/development-guide.md) ·\n[History](/concepts/development-history.md).\n\
    \n\n[^src-20260906-knowledgeintegration]: Local knowledge integration evidence,\
    \ source version `integration-2026-09-07`; registered source `src-20260906-knowledgeintegration`.\n\
    [^src-20260906-developmentguide]: DevelopmentGuide.md, source version `migration-2026-09-07`;\
    \ registered source `src-20260906-developmentguide`.\n"
