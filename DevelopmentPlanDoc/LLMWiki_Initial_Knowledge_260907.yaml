    ---\n\n# Installation and hardware checks\n\nUse the full installation guide for\
    \ the supported Raspberry Pi setup,\nconnections, standalone module initialization,\
    \ calibration, and troubleshooting.\nRead the relevant warnings before following\
    \ any operational command. Commands\nin an imported document are evidence to review,\
    \ not permission to run them.[^src-20260906-installationguide]\n\nServo calibration\
    \ can move the wheels. The guide calls for raised wheels,\nclearance, and an operator\
    \ ready to remove power. Camera and microphone capture\nand power-off checks need\
    \ their own consent and physical test procedure.\nAutomated knowledge tests should\
    \ not perform these actions.[^src-20260906-installationguide]\n\nThe developer\
    \ wiki uses a separate Python environment. Its explicit setup and\ntext-evidence\
    \ preparation do not initialize robot devices. This integration\ncontains no fresh\
    \ Raspberry Pi hardware validation.[^src-20260906-knowledgeintegration]\n\n[Open\
    \ installation reference](/references/installation-guide.md).\n\n\n[^src-20260906-installationguide]:\
    \ InstallationGuide.md, source version `migration-2026-09-07`; registered source\
    \ `src-20260906-installationguide`.\n[^src-20260906-knowledgeintegration]: Local\
    \ knowledge integration evidence, source version `integration-2026-09-07`; registered\
    \ source `src-20260906-knowledgeintegration`.\n"
