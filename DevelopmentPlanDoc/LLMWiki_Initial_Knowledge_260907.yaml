    ---\n\n# NinjaRobotPi5 project overview\n\nNinjaRobotPi5 documents an Agent layer\
    \ for user/model interaction, an IDE layer\nfor coordinating devices, and managed\
    \ Pi5 libraries for individual devices.\nThe development guide describes their\
    \ permitted ownership boundary.[^src-20260906-developmentguide]\n\nThe local wiki\
    \ is the primary developer knowledge collection. Full manuals are\nversioned under\
    \ raw source folders; outer README links and the project knowledge\nmap identify\
    \ the current versions. Read source records and limitations, then\ncompare important\
    \ claims with the current checkout before coding.[^src-20260906-knowledgeintegration]\n\
    \n## Browse project knowledge\n\n- [Architecture and hardware ownership](concepts/architecture.md)\n\
