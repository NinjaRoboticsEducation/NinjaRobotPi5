    ---\n\n# Features, MCP tools, and Agent Skills\n\nThe development guide describes\
    \ conversational and web interfaces, model\nproviders, behaviors, memory, and\
    \ device capabilities. These are documented\nimplementation areas; use the current\
    \ code and tests to verify a specific\nfeature or failure case before changing\
    \ it.[^src-20260906-developmentguide]\n\nMCP (Model Context Protocol) lets an\
    \ application discover and call external tools.\nThe robot tutorial describes\
    \ allowlisted read-only tools, bounded results,\ntimeouts, and untrusted external\
    \ content. Its examples include Tavily search\nand a read-only Google Calendar\
    \ server. Agent Skills package reusable workflows;\nthey do not grant extra hardware\
    \ permissions.[^src-20260906-ninjarobot-mcp-skill]\n\nDevelopment wiki skills\
    \ are a separate coding-tool workflow. This local knowledge\nintegration does\
    \ not install a robot MCP provider or change runtime interfaces.\nUse the existing\
    \ robot tutorial for robot extensions and the wiki maintenance\nguide for developer\
    \ knowledge updates.[^src-20260906-knowledgeintegration]\n\n[MCP and skills tutorial](/references/mcp-skills-guide.md).\n\
