[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ninjarobot-pi5-agent"
version = "0.1.0"
description = "Provider-neutral agent contracts and CLI for NinjaRobotPi5V4."
requires-python = ">=3.11,<3.14"
dependencies = [
    "ninjarobot-pi5-ide",
    "pydantic>=2.12,<3",
]

[project.scripts]
ninjarobot_pi5_cli = "ninjarobot_pi5_agent.cli:main"

[tool.uv.sources]
ninjarobot-pi5-ide = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ninjarobot_pi5_agent"]
