[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ninjarobot-pi5-ide"
version = "0.1.0"
description = "Deterministic middleware contracts for NinjaRobotPi5V4."
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.1,<9",
    "pillow>=10.1,<13",
    "pydantic>=2.12,<3",
]

[project.scripts]
ninjarobot-ide-tool = "ninjarobot_pi5_ide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ninjarobot_pi5_ide"]
