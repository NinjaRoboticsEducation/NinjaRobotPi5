[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ninjarobot-pi5-ide"
version = "1.0.0"
description = "Deterministic middleware contracts for NinjaRobotPi5V4."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "blessed>=1.20,<2",
    "click>=8.1,<9",
    "pillow>=10.1,<13",
    "pydantic>=2.12,<3",
    "qrcode[pil]==8.2",
]

[project.optional-dependencies]
# Kept as an empty compatibility extra for existing installers. QR rendering is
# part of the base IDE import/runtime contract and can no longer be optional.
display-qr = []
bluetooth = ["dbus-fast==5.0.22"]
voice = [
    "onnxruntime==1.27.0",
    "openwakeword==0.6.0",
]

[project.scripts]
ninjarobot-ide-tool = "ninjarobot_pi5_ide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ninjarobot_pi5_ide"]
