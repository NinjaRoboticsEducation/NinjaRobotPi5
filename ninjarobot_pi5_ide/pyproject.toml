[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ninjarobot-pi5-ide"
version = "0.1.0"
description = "Deterministic middleware contracts for NinjaRobotPi5V4."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ninjarobot_pi5_ide"]
